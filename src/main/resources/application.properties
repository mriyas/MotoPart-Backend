# ---- Server ----
server.port=8080
server.servlet.context-path=/motopart/public

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/motopart
spring.datasource.username=motopart
spring.datasource.password=motopart
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Schema is managed by Flyway, so let Hibernate only validate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ---- File uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads
app.upload.public-base-url=http://localhost:8080/motopart/public/files

